<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لعبة المافيا | شاشة التلفاز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<link rel="stylesheet" href="../shared/mafia.css">
<style>
html,body{height:100%;overflow:hidden}
body{font-size:2.1vh;cursor:none;padding:2.2vh 2.6vh}
#lobby{display:grid;grid-template-columns:1fr auto;gap:4vh;align-items:center;max-width:2100px;margin:0 auto;height:100%}
.hero h1{font-family:var(--f-display);font-size:11vh;line-height:1;margin:0;color:var(--accent)}
.hero p{font-size:2.5vh;color:var(--muted);margin:1.2vh 0 3vh;line-height:1.8;max-width:52ch}
.codeRow{display:flex;gap:1.4vh;direction:ltr;justify-content:flex-end;margin-bottom:3vh}
.codeRow b{font-family:var(--f-display);font-size:13vh;line-height:1;width:1.15em;text-align:center;background:var(--surface);border:2px solid var(--accent);border-radius:1.6vh;padding:1vh 0;color:var(--ink)}
.how{display:grid;gap:1vh;font-size:2.4vh;color:var(--muted)}.how b{color:var(--ink)}
.how code{direction:ltr;unicode-bidi:isolate;color:var(--accent);font-weight:700}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vh;margin-top:3vh}
.slot{display:flex;align-items:center;gap:1vh;padding:1.2vh 1.5vh;border-radius:1.4vh;background:var(--surface);border:1px solid var(--line);font-size:2.3vh;font-weight:600;min-height:6.4vh}
.slot.empty{border-style:dashed;color:var(--muted);font-weight:400;background:transparent}
.slot small{color:var(--muted);font-weight:400;font-size:1.7vh;margin-inline-start:auto}
.qrbox{background:#fff;border-radius:2vh;padding:1.6vh;box-shadow:var(--shadow);text-align:center;color:#111}
.qrbox img{display:block;width:32vh;height:32vh}
.qrbox span{display:block;margin-top:.8vh;font-weight:700;font-size:2.3vh}
#game{display:flex;flex-direction:column;gap:1.8vh;height:100%}
.phead{display:flex;align-items:center;gap:2vh}
.phead .ph{flex:1;border-radius:1.8vh;padding:1.6vh 2.2vh;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:2vh}
.phead .ph .ic{font-size:5.4vh;line-height:1}
.phead .ph b{font-size:3.6vh}
.phead .ph span{color:var(--muted);font-size:2.2vh}
.phead .ph.night{background:#101736;border-color:#2c3a7a}.phead .ph.day{background:#2e2410;border-color:#6b5518}.phead .ph.vote{background:#33131a;border-color:#7a2436}
.badge{display:flex;align-items:center;gap:1.4vh;padding:1vh 1.8vh;border-radius:1.6vh;background:var(--surface);border:1px solid var(--line)}
.badge b{font-family:var(--f-display);font-size:4.6vh;letter-spacing:.12em;color:var(--accent);direction:ltr}
.badge img{width:6.4vh;height:6.4vh;border-radius:.8vh;background:#fff;padding:.4vh}
.twrap{display:flex;align-items:center;gap:1.6vh;min-width:34vh}
.twrap .tm{font-family:var(--f-display);font-size:4.4vh;color:var(--accent);min-width:2.2em;text-align:center}
.tbar{flex:1;height:1.5vh;border-radius:99px;background:var(--surface2);overflow:hidden}.tbar i{display:block;height:100%;background:var(--accent)}
.gmain{flex:1;min-height:0;display:flex;gap:2.2vh}
.pgrid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(26vh,1fr));gap:1.4vh;align-content:start;min-width:0}
.pl{padding:1.5vh 1.8vh;border:1px solid var(--line);border-radius:1.8vh;background:var(--surface);display:flex;align-items:center;gap:1.4vh}
.pl .avatar{width:5.6vh;height:5.6vh;font-size:2.6vh}
.pl b{font-size:2.7vh}
.pl small{display:block;color:var(--muted);font-size:1.9vh;margin-top:.3vh}
.pl.dead{opacity:.48}.pl.dead b{text-decoration:line-through}
.pl .st{margin-inline-start:auto;font-size:2vh;text-align:center}
#side{flex:0 0 44vh;display:flex;flex-direction:column;gap:1.4vh;min-height:0}
#log{flex:1.2;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:1.6vh;background:var(--surface);padding:1.2vh 1.8vh;font-size:1.95vh;line-height:1.75;color:var(--muted)}
#log div:first-child{color:var(--ink);font-weight:600}
#chatbox{flex:1;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:1.6vh;background:var(--surface);padding:1.2vh 1.8vh;display:flex;flex-direction:column;gap:.6vh}
#chatbox h3{margin:0;font-size:2vh;color:var(--accent)}
#chatbox .clist{display:flex;flex-direction:column;gap:.7vh;overflow:hidden;font-size:1.9vh;line-height:1.45}
#chatbox .empty{color:var(--muted)}
#status{position:fixed;inset:0;z-index:40;background:rgba(5,8,20,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;font-size:4vh;text-align:center;padding:4vh}
#status small{font-size:2.4vh;color:var(--muted)}
#win{position:fixed;inset:0;z-index:35;background:rgba(5,8,20,.9);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2vh;text-align:center;padding:3vh;overflow:auto}
#win h2{font-family:var(--f-display);font-size:10vh;margin:0;color:var(--accent)}
#win .st{display:grid;gap:1vh;min-width:52vh;font-size:2.7vh}
#win .st div{display:flex;gap:2vh;justify-content:space-between;align-items:center;padding:1vh 2vh;background:var(--surface);border-radius:1.4vh}
#tally:empty{display:none}
#tally{border:1px solid var(--line);border-radius:1.6vh;background:var(--surface);padding:1.2vh 1.8vh}
#tally .trow{font-size:2.15vh}.trow .fill{display:block}
.pl .avatar{font-size:3vh}
</style>
</head>
<body>
<div class="stars"></div>
<section id="lobby" hidden></section>
<section id="game" hidden>
  <div class="phead"><div class="ph" id="phbanner"></div><div class="twrap"><div class="tbar"><i id="tfill"></i></div><div class="tm" id="ttext">--</div></div><div class="badge" id="badge"></div></div>
  <div id="tally"></div>
  <div class="gmain">
    <div class="pgrid" id="pgrid"></div>
    <aside id="side"><div id="log"></div>
      <div id="chatbox"><h3>شات الغرفة</h3><div class="clist" id="clist"><div class="empty">لا رسائل بعد — يكتب اللاعبون من تبويب «شات» في هواتفهم (نهاراً).</div></div></div>
    </aside>
  </div>
</section>
<div id="toasts"></div>
<div id="win" hidden></div>
<div id="status" hidden></div>
<script src="../shared/net.js"></script>
<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COLORS = ['#e74c3c','#3498db','#2ecc71','#b7950b','#9b59b6','#e67e22','#1abc9c','#fd79a8','#7f8c9b','#d63031','#00b894','#6c5ce7'];
const CHARS = ['🧑‍💼','👩‍💼','🧔','👱‍♀️','👳‍♂️','🧕','👴','👵','🕴️','👨‍🎨','👩‍🎤','🧑‍🚀'];
const ROLE = { mafia: ['🔪', 'مافيا'], doctor: ['💉', 'طبيب'], detective: ['🔎', 'محقق'], citizen: ['🧑', 'مواطن'] };
const params = new URLSearchParams(location.search), watchCode = params.get('c');
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } } };
let S = null, lobby = null, code = null, status = 'connecting', err = null, raf = 0, chat = [], offset = 0, totalMs = 0;
const joinHost = location.host + '/play';

const net = Net.connect({
  onOpen() { err = null; if (watchCode) net.send({ t: 'watch', code: watchCode }); else net.send({ t: 'create', role: 'tv', resume: store.get('mf_tvRoom') || undefined }); },
  onStatus(s) { status = s; draw(); },
  onMsg(m) {
    if (m.t === 'created') { code = m.code; if (!watchCode) store.set('mf_tvRoom', code); }
    else if (m.t === 'lobby') { lobby = m; S = null; code = m.code; }
    else if (m.t === 'state') { S = m.s; code = m.code; lobby = null; offset = Date.now() - S.serverNow; totalMs = Math.max(0, S.deadline - S.serverNow); }
    else if (m.t === 'chatHist') { chat = Array.isArray(m.list) ? m.list.slice(-50) : []; }
    else if (m.t === 'ev') return onEvent(m.e);
    else if (m.t === 'err') { err = m.m; if (m.fatal) store.set('mf_tvRoom', ''); }
    draw();
  },
});
function onEvent(e) {
  if (e.e === 'chat') { if (e.ch === 'public') { chat.push({ id: e.id, n: e.n, m: e.m }); if (chat.length > 50) chat.splice(0, chat.length - 50); } draw(); return; }
  if (e.e === 'toast') toast(e.m);
}
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; const box = $('#toasts'); box.appendChild(t); while (box.children.length > 3) box.firstChild.remove(); setTimeout(() => t.remove(), 3000); }
function draw() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(); }); }
setInterval(() => { /* عدّاد المرحلة */
  if (!S || S.over || !S.deadline) return;
  const left = Math.max(0, S.deadline - (Date.now() - offset));
  const el = $('#ttext'), f = $('#tfill');
  if (el) el.textContent = Math.ceil(left / 1000) + '';
  if (f) f.style.width = (totalMs ? Math.round(left / totalMs * 100) : 0) + '%';
}, 500);

function paint() {
  const st = $('#status');
  if (err) { st.hidden = false; st.innerHTML = `<div>${esc(err)}</div><small>${watchCode ? 'تأكد من كود الغرفة ثم أعد التحميل' : ''}</small>`; }
  else if (status !== 'open') { st.hidden = false; st.innerHTML = `<div>جارٍ الاتصال بالخادم...</div><small>${esc(location.host)}</small>`; }
  else st.hidden = true;
  document.body.dataset.phase = S ? S.phase : 'lobby';
  $('#lobby').hidden = !!S || !code; $('#game').hidden = !S;
  if (S) paintGame(); else if (code) paintLobby();
}
function paintLobby() {
  const pl = lobby ? lobby.players : [];
  const slots = Array.from({ length: 12 }, (_, i) => pl[i]
    ? `<div class="slot"><span class="avatar charf" style="background:${COLORS[i]};font-size:2.6vh">${CHARS[i] || '🧑'}</span>${esc(pl[i].name)}<small>${pl[i].bot ? 'آلي' : pl[i].host ? 'المضيف' : pl[i].connected ? '' : 'غير متصل'}</small></div>`
    : '<div class="slot empty">بانتظار لاعب...</div>').join('');
  $('#lobby').innerHTML = `<div class="hero"><h1>🕵️ المافيا</h1>
    <p>المافيا تقتل في الليل، والمدينة تناقش وتصوّت في النهار. الأدوار سرية — لا أحد يعرف دور غيره إلا من هاتفه. يلزم 5 لاعبين على الأقل (يمكن للمضيف إضافة لاعبين آليين).</p>
    <div class="codeRow">${String(code).split('').map((d) => `<b>${d}</b>`).join('')}</div>
    <div class="how"><div>عدد المافيا: <b>${lobby && lobby.cfg ? (lobby.cfg.mafia ? '🔪 × ' + lobby.cfg.mafia : 'تلقائي حسب عدد اللاعبين') : 'تلقائي'}</b> — يضبطه المضيف من هاتفه قبل البدء</div><div>1. افتح على هاتفك <code>${esc(joinHost)}</code> أو امسح الرمز</div><div>2. أدخل كود الغرفة <b>${esc(code)}</b> واكتب اسمك</div><div>3. المضيف (أول من ينضم) يضغط «ابدأ اللعبة» من هاتفه</div></div>
    <div class="slots">${slots}</div></div>
    <div class="qrbox"><img src="/qr?c=${encodeURIComponent(code)}" alt="رمز QR للانضمام"><span>امسح للانضمام</span></div>`;
}
const PH = { night: ['🌙', 'الليل', 'المافيا والطبيب والمحقق يتحركون سراً من هواتفهم...'], day: ['☀️', 'النقاش', 'ناقشوا بصوت عالٍ، ومن جاهز يضغط «جاهز للتصويت» في هاتفه'], vote: ['🗳️', 'التصويت', 'كل لاعب حي يصوّت من هاتفه لإقصاء مشتبه به'], ended: ['🏆', 'انتهت اللعبة', ''] };
function paintGame() {
  const ph = PH[S.phase] || PH.day;
  const b = $('#phbanner'); b.className = 'ph ' + S.phase;
  let sub = ph[2];
  if ((S.phase === 'day' || S.phase === 'vote') && S.lastNight) sub = S.lastNight.died !== null && S.lastNight.died !== undefined ? `☀️ هذا الصباح: قُتل ${S.players[S.lastNight.died].name} في الليلة ${S.lastNight.round}` : `☀️ هذا الصباح: ${S.lastNight.saved ? 'الطبيب أنقذ ضحية المافيا!' : 'لا قتلى البارحة'} — ${ph[2]}`;
  b.innerHTML = `<span class="ic floaty">${ph[0]}</span><div><b>${ph[1]} — الجولة ${S.round}</b><br><span>${esc(sub)}</span></div>`;
  const tl = $('#tally');
  if (S.voteTally && S.voteTally.counts && S.phase !== 'vote') {
    const rows = Object.entries(S.voteTally.counts).map(([id, c]) => ({ id: +id, c })).sort((a, b2) => b2.c - a.c);
    const mx = Math.max(1, ...rows.map((r) => r.c));
    tl.innerHTML = `<div class="tally">${rows.map((r) => `<div class="trow ${S.voteTally.out === r.id ? 'out' : ''}"><span class="nm">${CHARS[r.id] || ''} ${esc(S.players[r.id].name)}${S.voteTally.out === r.id ? ' — أُقصي 🗳️' : ''}</span><span class="track"><span class="fill" style="width:${Math.round(r.c / mx * 100)}%"></span></span><span class="cnt">${r.c}</span></div>`).join('')}</div>`;
  } else tl.innerHTML = '';
  $('#badge').innerHTML = `<b>${esc(code)}</b><img src="/qr?c=${encodeURIComponent(code)}" alt="QR">`;
  $('#pgrid').innerHTML = S.players.map((p) => {
    const role = p.role ? ROLE[p.role] : null;
    let st = '';
    if (!p.alive) st = role ? `${role[0]} ${role[1]}` : 'خارج اللعبة';
    else if (S.phase === 'vote') st = p.voted ? '✔ صوّت' : 'بانتظار صوته';
    else if (S.phase === 'day') st = p.ready ? '✔ جاهز' : 'يناقش...';
    else if (S.phase === 'night') st = '😴';
    return `<div class="pl ${p.alive ? '' : 'dead'}"><span class="avatar charf" style="background:${COLORS[p.id]}">${CHARS[p.id] || '🧑'}</span><div><b>${esc(p.name)}</b>${p.alive ? '' : ' <span class="stamp">مات</span>'}${p.bot ? ' <span class="tag">آلي</span>' : ''}<small>${p.alive ? 'على قيد الحياة' : 'مات' + (role ? ' — كان ' + role[1] : '')}</small></div><span class="st">${st}</span></div>`;
  }).join('');
  $('#log').innerHTML = S.log.slice(-9).reverse().map((l) => `<div>${esc(l)}</div>`).join('');
  $('#clist').innerHTML = chat.length ? chat.slice(-7).map((c) => `<div><b style="color:${COLORS[c.id] || 'var(--ink)'}">${esc(c.n)}:</b> ${esc(c.m)}</div>`).join('') : '<div class="empty">لا رسائل بعد — يكتب اللاعبون من تبويب «شات» في هواتفهم (نهاراً).</div>';
  const w = $('#win');
  if (S.over) {
    w.hidden = false;
    const confetti = Array.from({ length: 22 }, (_, i) => `<i style="left:${(i * 43) % 100}%;background:${['#e8b33c', '#e0453a', '#3ec97e', '#4da3ff', '#a678ff'][i % 5]};animation-duration:${2.8 + (i % 5) * 0.5}s;animation-delay:${(i % 8) * 0.3}s"></i>`).join('');
    w.innerHTML = `<div class="confetti">${confetti}</div><small style="font-size:3vh;color:var(--muted)">${S.winner === 'town' ? 'فاز الأبرياء 🏆' : 'فازت المافيا 🔪'}</small><h2>${S.winner === 'town' ? 'المدينة تنتصر!' : 'المافيا تسيطر!'}</h2>
    <div class="st">${S.players.map((p) => { const r = ROLE[p.role]; return `<div><span><span class="avatar" style="background:${COLORS[p.id]}">${esc(p.name.slice(0, 1))}</span> ${esc(p.name)} ${p.alive ? '' : '(مات)'}</span><b>${r ? r[0] + ' ' + r[1] : ''}</b></div>`; }).join('')}</div>
    <small style="font-size:2.4vh;color:var(--muted)">يبدأ المضيف لعبة جديدة من هاتفه</small>`;
  } else w.hidden = true;
}
})();
</script>
</body>
</html>
