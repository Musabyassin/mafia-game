<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لعبة المافيا | الهاتف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<link rel="stylesheet" href="../shared/mafia.css">
<style>
body{display:flex;flex-direction:column;min-height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(13,16,32,.92);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
header .logo{font-family:var(--f-display);font-size:22px;color:var(--accent)}
header .mechip{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
#root{flex:1;width:100%;max-width:640px;margin:0 auto;padding:14px 14px 20px;display:flex;flex-direction:column;gap:12px}
.join{display:grid;gap:14px}
.join h1{font-family:var(--f-display);font-size:44px;color:var(--accent);text-align:center;margin:8px 0 0}
#tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);position:sticky;bottom:0;z-index:20}
#tabs button{flex:1;background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:700;padding:9px 2px 11px;cursor:pointer;display:grid;gap:2px;justify-items:center;position:relative}
#tabs button .ic{font-size:21px;line-height:1}
#tabs button.on{color:var(--accent)}
#tabs .dot{position:absolute;top:6px;inset-inline-end:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--red)}
.view{display:grid;gap:12px;align-content:start}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);font-weight:600}
.setrow:last-child{border-bottom:0}
.switch{position:relative;width:52px;height:30px;flex:0 0 auto}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;background:var(--surface2);border:1px solid var(--line);border-radius:99px;transition:.2s}
.switch i:after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.switch input:checked + i{background:#3a3f74;border-color:var(--accent)}
.switch input:checked + i:after{transform:translateX(-22px);background:var(--accent)}
[dir=rtl] .switch input:checked + i:after{transform:translateX(-22px)}
</style>
</head>
<body>
<div id="conn" hidden>انقطع الاتصال — جارٍ إعادة المحاولة...</div>
<header><span class="logo">🕵️ المافيا</span><span class="mechip" id="mechip"></span></header>
<main id="root"></main>
<nav id="tabs" hidden>
  <button data-tab="game" class="on"><span class="ic">🎲</span>اللعبة</button>
  <button data-tab="chat"><span class="ic">💬</span>شات<span class="dot" id="chatdot" hidden></span></button>
  <button data-tab="log"><span class="ic">📜</span>السجل</button>
  <button data-tab="settings"><span class="ic">⚙️</span>إعدادات</button>
</nav>
<div id="toasts"></div>
<div id="modal" hidden></div>
<script src="../shared/net.js"></script>
<script src="play.js"></script>
<script src="play-game.js"></script>
</body>
</html>
